name: Refresh mortgage-rate benchmarks

on:
  schedule:
    - cron: '30 18 * * 4,5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: mortgage-rate-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/build-interactive-mortgage-calculator
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download the official weekly PMMS history
        run: python3 scripts/download-rates.py
      - name: Validate data and calculator
        run: npm test
      - name: Publish refreshed benchmarks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/mortgage-rates.json; then
            echo 'No rate changes to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/mortgage-rates.json
          git commit -m 'Refresh weekly Freddie Mac mortgage-rate benchmarks'
          git push origin HEAD:codex/build-interactive-mortgage-calculator
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
